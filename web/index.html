  <script>
    // Mô phỏng cử chỉ vuốt từ mép trái để quay lại (Back Swipe) như App trên trình duyệt di động
    let touchStartX = 0;
    let touchStartY = 0;
    let isLeftEdgeTouch = false;

    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches.length === 1) {
        const touch = e.touches[0];
        const edgeThreshold = 25; // Vùng nhận diện chạm mép
        if (touch.clientX < edgeThreshold) {
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
          isLeftEdgeTouch = true;
          // Ngăn chặn cử chỉ vuốt chuyển trang mặc định của trình duyệt
          e.preventDefault();
        } else if (touch.clientX > window.innerWidth - edgeThreshold) {
          isLeftEdgeTouch = false;
          // Chặn vuốt từ mép phải (để không bị forward gây lỗi)
          e.preventDefault();
        } else {
          isLeftEdgeTouch = false;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', function (e) {
      if (isLeftEdgeTouch && e.touches && e.touches.length === 1) {
        // Tiếp tục chặn chuyển trang của trình duyệt trong quá trình vuốt
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', function (e) {
      if (isLeftEdgeTouch && e.changedTouches && e.changedTouches.length === 1) {
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = Math.abs(touch.clientY - touchStartY);

        // Nếu vuốt ngang sang phải đủ xa (> 55px) và ít lệch chiều dọc (< 40px)
        if (deltaX > 55 && deltaY < 40) {
          // Gọi quay lại lịch sử (tương đương nhấn nút Back trong Flutter)
          window.history.back();
        }
      }
      isLeftEdgeTouch = false;
    }, { passive: false });

    // Lưu pending notification từ Service Worker để Flutter pull khi sẵn sàng
    window.__pendingSwNotification = null;
    window.__swNotificationDelivered = false;

    // Flutter gọi hàm này khi đã xử lý notification xong
    window.__markSwNotificationDelivered = function () {
      window.__swNotificationDelivered = true;
      window.__pendingSwNotification = null;
    };

    if ('serviceWorker' in navigator) {
      // Lắng nghe message từ Service Worker (Firebase SDK tự đăng ký SW)
      navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'notification') {
          window.__pendingSwNotification = event.data;
          window.__swNotificationDelivered = false;

          // Bắn message NGAY LẬP TỨC cho Flutter, không chờ 300ms
          window.postMessage(event.data, '*');

          // Retry gửi vào window mỗi 300ms tối đa 30 lần (9 giây)
          // Đề phòng trường hợp Flutter chưa thực sự sẵn sàng
          let attempts = 0;
          const interval = setInterval(function () {
            if (window.__swNotificationDelivered || attempts >= 30) {
              clearInterval(interval);
              return;
            }
            attempts++;
            window.postMessage(event.data, '*');
          }, 300);
        }
      });

      // Khi SW sẵn sàng (do Firebase SDK đăng ký), yêu cầu pending notification
      // Dùng setTimeout để không block thread chính, tránh trắng màn mobile
      setTimeout(function () {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'GET_PENDING_NOTIFICATION' });
        }
      }, 1000);

      // Khi tab được focus lại từ background/suspended (tap notification khi app chạy ngầm),
      // yêu cầu pending notification từ SW cache vì postMessage bị mất khi tab suspend
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'GET_PENDING_NOTIFICATION' });
        }
      });
    }

    // Xin persistent storage để PWA ít bị browser dọn cache media hơn.
    // Không phải browser nào cũng cho, nhưng nếu được thì cache ảnh/video bền hơn rõ.
    if (navigator.storage && navigator.storage.persist) {
      setTimeout(function () {
        navigator.storage.persist().catch(function () { });
      }, 1500);
    }
  </script>
  <!-- Agora RTC Web SDK -->
  <script>
    (function () {
      const today = new Date().toISOString().slice(0, 10);

      const reloadKey = 'gamenect_reload_count_' + today;
      const hardReloadKey = 'gamenect_hard_reload_count_' + today;
      const blockKey = 'gamenect_reload_block_until';

      const reloadLimit = 25;      // reload thường quá 25 lần/ngày thì chặn
      const hardReloadLimit = 7;   // hard reload quá 7 lần/ngày thì chặn
      const blockMs = 24 * 60 * 60 * 1000; // chặn 1 ngày

      const now = Date.now();

      function showBlockedScreen(reason) {
        document.body.innerHTML = `
        <div style="
          height:100vh;
          width:100vw;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#fff;
          color:#111;
          font-family:Arial,sans-serif;
          text-align:center;
          padding:24px;
          box-sizing:border-box;
        ">
          <div style="
            max-width:380px;
            border:3px solid #111;
            border-radius:16px;
            padding:24px;
            box-shadow:6px 6px 0 #111;
          ">
            <div style="font-size:44px;margin-bottom:12px;">🛑</div>
            <h2 style="margin:0 0 10px;font-size:22px;">Tải lại quá nhiều</h2>
            <p style="margin:0 0 12px;font-size:15px;line-height:1.45;">
              ${reason}
            </p>
            <p style="margin:0;font-size:14px;font-weight:700;">
              Vui lòng quay lại sau.
            </p>
          </div>
        </div>
      `;
      }

      function getCount(key) {
        return Number(localStorage.getItem(key) || '0');
      }

      function setCount(key, value) {
        localStorage.setItem(key, String(value));
      }

      function addBlockDay(reason) {
        const currentBlockUntil = Number(localStorage.getItem(blockKey) || '0');

        // Nếu đang bị chặn thì cộng tiếp từ hạn chặn cũ.
        // Nếu chưa bị chặn thì cộng từ hiện tại.
        const baseTime = Math.max(currentBlockUntil, Date.now());
        const newBlockUntil = baseTime + blockMs;

        localStorage.setItem(blockKey, String(newBlockUntil));
        showBlockedScreen(reason);
      }

      try {
        const blockUntil = Number(localStorage.getItem(blockKey) || '0');

        // Nếu còn hạn chặn thì không load app
        if (blockUntil > now) {
          showBlockedScreen(
            'Bạn đã reload quá giới hạn trong hôm nay để tránh app tải media liên tục.'
          );
          return;
        }

        const navEntry = performance.getEntriesByType('navigation')[0];
        const isReload = navEntry && navEntry.type === 'reload';

        // Chỉ tính khi user reload trang
        if (isReload) {
          const reloadCount = getCount(reloadKey) + 1;
          setCount(reloadKey, reloadCount);

          // Đoán hard reload: cache bị bypass / service worker chưa control / bootstrap tải network
          const isLikelyHardReload =
            !navigator.serviceWorker.controller ||
            (navEntry && navEntry.transferSize > 0);

          if (isLikelyHardReload) {
            const hardReloadCount = getCount(hardReloadKey) + 1;
            setCount(hardReloadKey, hardReloadCount);

            if (hardReloadCount > hardReloadLimit) {
              addBlockDay(
                'Bạn đã hard reload quá 7 lần trong hôm nay. Thời gian chặn đã được cộng thêm 1 ngày.'
              );
              return;
            }
          }

          if (reloadCount > reloadLimit) {
            addBlockDay(
              'Bạn đã reload quá 25 lần trong hôm nay. Thời gian chặn đã được cộng thêm 1 ngày.'
            );
            return;
          }
        }
      } catch (e) {
        console.warn('Reload guard failed:', e);
      }

      // Không bị chặn thì mới load Agora
      const agoraScript = document.createElement('script');
      agoraScript.src =
        'https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js';
      document.body.appendChild(agoraScript);

      // Không bị chặn thì mới load Flutter app
      const flutterScript = document.createElement('script');
      flutterScript.src = 'flutter_bootstrap.js';
      flutterScript.async = true;
      document.body.appendChild(flutterScript);
    })();
  </script>
  <script>
    (function () {
      let fullViewportHeight = 0;

      function resetViewportBaseline() {
        const viewport = window.visualViewport;
        if (!viewport) return;
        fullViewportHeight = Math.max(viewport.height, window.innerHeight);
      }

      function publishKeyboardInset() {
        const viewport = window.visualViewport;
        if (!viewport) return;

        if (!fullViewportHeight) {
          resetViewportBaseline();
        }

        // Không cập nhật baseline khi bàn phím đang mở.
        if (viewport.height > fullViewportHeight - 40) {
          fullViewportHeight = Math.max(
            fullViewportHeight,
            viewport.height,
            window.innerHeight
          );
        }

        const rawInset = Math.max(
          0,
          fullViewportHeight - viewport.height - viewport.offsetTop
        );
        const inset = rawInset >= 80 ? Math.round(rawInset) : 0;

        window.__gamenectKeyboardInset = inset;
        window.postMessage({
          type: 'gamenectKeyboardInset',
          inset: inset
        }, '*');

        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }

      if (window.visualViewport) {
        resetViewportBaseline();
        window.visualViewport.addEventListener('resize', publishKeyboardInset);
        window.visualViewport.addEventListener('scroll', publishKeyboardInset);
        window.addEventListener('orientationchange', function () {
          fullViewportHeight = 0;
          setTimeout(function () {
            resetViewportBaseline();
            publishKeyboardInset();
          }, 300);
        });
        publishKeyboardInset();
      }
    })();
  </script>
