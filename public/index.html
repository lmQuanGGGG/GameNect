<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameNect Payment</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #101012; /* Dark theme scaffold color */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      overflow: hidden;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(123, 97, 255, 0.2) 0%, rgba(16, 16, 18, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      width: 90%;
      max-width: 380px;
      background: #141416;
      border-radius: 28px;
      /* Neumorphic Dark Shadow + Glowing Border effect */
      box-shadow: 
        8px 8px 24px rgba(0, 0, 0, 0.6), 
        -8px -8px 24px rgba(255, 255, 255, 0.02),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #FFFFFF 0%, #A0A0A5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 15px;
      color: #8E8E93; /* textTertiaryColor */
      line-height: 1.5;
      margin-bottom: 2.5rem;
    }

    /* Neo Loader */
    .loader-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto;
    }

    .loader {
      width: 100%;
      height: 100%;
      border: 4px solid rgba(123, 97, 255, 0.1);
      border-top-color: #7B61FF; /* Primary purple accent */
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 15px rgba(123, 97, 255, 0.3);
    }

    .loader-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: #7B61FF;
      border-radius: 50%;
      box-shadow: 0 0 20px #7B61FF;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Status Badge */
    .status {
      margin-top: 2rem;
      padding: 0.85rem 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      font-size: 13px;
      color: #A0A0A5;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2), inset -2px -2px 5px rgba(255,255,255,0.02);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="container">
    <h1 id="title">Đang xử lý...</h1>
    <p id="message">Vui lòng không đóng cửa sổ này</p>
    
    <div class="loader-wrapper" id="loader-wrapper">
      <div class="loader"></div>
      <div class="loader-inner"></div>
    </div>
    
    <div class="status" id="status" style="display:none;"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderCode = params.get('orderCode');
    const isSuccess = window.location.pathname.includes('success');
    const isCancel = window.location.pathname.includes('cancel');

    if (orderCode) {
      if (isSuccess) {
        document.getElementById('title').textContent = 'Thanh toán thành công!';
        document.getElementById('title').style.background = 'linear-gradient(135deg, #E2F163 0%, #A4B32A 100%)';
        document.getElementById('message').textContent = 'Đang chuyển bạn về lại ứng dụng...';
        document.getElementById('loader-wrapper').style.display = 'none';
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').textContent = `Mã GD: ${orderCode}`;
        
        setTimeout(() => {
          window.location.href = 'gamenect://payment/success' + window.location.search;
        }, 1500);
      } else if (isCancel) {
        document.getElementById('title').textContent = 'Đã hủy giao dịch';
        document.getElementById('title').style.background = 'linear-gradient(135deg, #FF6B6B 0%, #C92A2A 100%)';
        document.getElementById('message').textContent = 'Vui lòng quay lại ứng dụng để tiếp tục';
        document.getElementById('loader-wrapper').style.display = 'none';
        
        setTimeout(() => {
          window.location.href = 'gamenect://payment/cancel' + window.location.search;
        }, 1500);
      } else {
        setTimeout(() => {
          window.location.href = 'gamenect://payment/success' + window.location.search;
        }, 2000);
      }
    } else {
      document.getElementById('title').textContent = 'Lỗi truy cập';
      document.getElementById('message').textContent = 'Không tìm thấy thông tin giao dịch';
      document.getElementById('loader-wrapper').style.display = 'none';
    }
  </script>
</body>
</html>
